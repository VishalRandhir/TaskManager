<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TaskFlow — Media Project Manager</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

:root {
    --primary: #6d4aff;
    --primary-dark: #4c2bbf;
    --secondary: #8b5cf6;
    --indigo: #4338ca;

    --dark: #17152b;
    --dark-2: #211d3b;

    --bg: #f7f7fc;
    --card: #ffffff;

    --text: #25233a;
    --muted: #858298;

    --border: #ebeaf3;

    --green: #16a36a;
    --orange: #d97706;
    --red: #dc3545;

    --shadow: 0 12px 35px rgba(44,35,100,.08);
}


/* ==============================
   RESET
================================ */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: "Inter", sans-serif;
    background: var(--bg);
    color: var(--text);
}

button,
input,
select {
    font-family: inherit;
}


/* ==============================
   SIDEBAR
================================ */

.sidebar {
    position: fixed;

    top: 0;
    left: 0;
    bottom: 0;

    width: 255px;

    padding: 25px 18px;

    background:
        linear-gradient(
            160deg,
            #1d1935,
            #141225
        );

    color: white;

    z-index: 100;

    transition: transform .3s ease;
}


/* Logo */

.logo {
    display: flex;
    align-items: center;
    gap: 11px;

    padding: 5px 10px 30px;

    font-size: 20px;
    font-weight: 800;
}

.logo-icon {
    width: 38px;
    height: 38px;

    display: grid;
    place-items: center;

    border-radius: 11px;

    background:
        linear-gradient(
            135deg,
            #6d4aff,
            #4338ca
        );

    box-shadow:
        0 8px 20px rgba(109,74,255,.3);
}


/* Mobile close button */

.sidebar-close {
    display: none;

    position: absolute;

    top: 22px;
    right: 18px;

    width: 34px;
    height: 34px;

    border: 0;

    border-radius: 9px;

    background:
        rgba(255,255,255,.08);

    color: white;

    font-size: 22px;

    cursor: pointer;
}

.sidebar-close:hover {
    background:
        rgba(255,255,255,.15);
}


/* Navigation */

.nav-title {
    margin: 18px 12px 10px;

    color: #85809d;

    font-size: 10px;

    font-weight: 700;

    letter-spacing: 1.2px;

    text-transform: uppercase;
}

.nav-item {
    display: flex;

    align-items: center;

    gap: 12px;

    width: 100%;

    padding: 12px;

    margin-bottom: 5px;

    border: 0;

    border-radius: 10px;

    background: transparent;

    color: #bcb8cf;

    font-size: 13px;

    text-align: left;

    cursor: pointer;

    transition: .2s;
}

.nav-item:hover {
    background:
        rgba(255,255,255,.06);

    color: white;
}

.nav-item.active {
    background:
        linear-gradient(
            90deg,
            rgba(109,74,255,.30),
            rgba(139,92,246,.12)
        );

    color: white;
}

.nav-icon {
    width: 18px;
    height: 18px;

    display: grid;
    place-items: center;

    flex-shrink: 0;
}

.nav-icon svg {
    width: 16px;
    height: 16px;
}


/* Sidebar bottom */

.sidebar-bottom {
    position: absolute;

    left: 18px;
    right: 18px;

    bottom: 22px;
}

.profile {
    display: flex;

    align-items: center;

    gap: 10px;

    padding: 18px 10px 0;

    border-top:
        1px solid rgba(255,255,255,.08);
}

.avatar {
    width: 37px;
    height: 37px;

    display: grid;
    place-items: center;

    border-radius: 50%;

    background:
        linear-gradient(
            135deg,
            #6d4aff,
            #4338ca
        );

    font-size: 13px;
    font-weight: 700;
}


/* ==============================
   MAIN
================================ */

.main {
    width: calc(100% - 255px);

    margin-left: 255px;

    padding: 30px;
}


/* Topbar */

.topbar {
    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 28px;
}

.topbar-left {
    display: flex;

    align-items: center;

    gap: 12px;
}

.greeting h1 {
    font-size: 26px;

    font-weight: 800;

    letter-spacing: -.5px;

    margin-bottom: 5px;
}

.greeting p {
    color: var(--muted);

    font-size: 13px;
}


/* Add */

.add-btn {
    border: none;

    padding: 12px 18px;

    border-radius: 10px;

    background:
        linear-gradient(
            135deg,
            var(--primary),
            var(--indigo)
        );

    color: white;

    font-size: 13px;

    font-weight: 700;

    cursor: pointer;

    box-shadow:
        0 8px 20px rgba(76,43,191,.22);

    transition: .2s;
}

.add-btn:hover {
    transform: translateY(-2px);
}


/* Mobile menu */

.mobile-menu {
    display: none;

    border: none;

    background: white;

    width: 40px;
    height: 40px;

    border-radius: 10px;

    cursor: pointer;

    font-size: 19px;

    box-shadow:
        0 5px 20px rgba(30,25,70,.08);
}


/* ==============================
   STATS
================================ */

.stats {
    display: grid;

    grid-template-columns:
        repeat(4,1fr);

    gap: 17px;

    margin-bottom: 22px;
}

.stat-card {
    background: var(--card);

    border:
        1px solid var(--border);

    border-radius: 15px;

    padding: 19px;

    box-shadow: var(--shadow);

    transition: .2s;
}

.stat-card:hover {
    transform: translateY(-2px);
}

.stat-top {
    display: flex;

    justify-content: space-between;

    align-items: center;
}

.stat-number {
    font-size: 27px;

    font-weight: 800;

    margin-bottom: 4px;
}

.stat-label {
    color: var(--muted);

    font-size: 12px;

    font-weight: 500;
}

.stat-icon {
    width: 42px;
    height: 42px;

    display: grid;
    place-items: center;

    border-radius: 11px;

    font-size: 17px;
}

.icon-purple {
    background: #efedff;
    color: #5b45d6;
}

.icon-indigo {
    background: #e9ecff;
    color: #4338ca;
}

.icon-lavender {
    background: #f0eaff;
    color: #754ee8;
}

.icon-red {
    background: #fff0f1;
    color: #dc3545;
}


/* ==============================
   CONTENT
================================ */

.content-grid {
    display: grid;

    grid-template-columns:
        minmax(0,1fr) 325px;

    gap: 20px;
}

.card {
    background: white;

    border:
        1px solid var(--border);

    border-radius: 16px;

    box-shadow: var(--shadow);
}


/* ==============================
   TASK HEADER
================================ */

.card-header {
    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 19px 20px;

    border-bottom:
        1px solid var(--border);
}

.card-header h2 {
    font-size: 16px;

    font-weight: 750;
}

.task-count {
    color: var(--muted);

    font-size: 11px;
}


/* ==============================
   FILTERS
================================ */

.filters {
    display: flex;

    gap: 8px;

    padding: 14px 20px;

    border-bottom:
        1px solid var(--border);
}

.search {
    flex: 1;

    min-width: 150px;

    padding: 10px 12px;

    border:
        1px solid var(--border);

    border-radius: 9px;

    outline: none;

    background: #fafafe;

    font-size: 12px;

    color: var(--text);
}

.search:focus {
    border-color:
        var(--primary);
}

.filter-btn {
    padding: 9px 12px;

    border:
        1px solid var(--border);

    background: white;

    border-radius: 8px;

    color: var(--muted);

    font-size: 11px;

    cursor: pointer;

    transition: .2s;
}

.filter-btn:hover {
    background: #f7f5ff;
}

.filter-btn.active {
    background: #eeebff;

    border-color: #d9d3ff;

    color: #5438c8;

    font-weight: 700;
}


/* ==============================
   TASK
================================ */

.task-list {
    padding: 5px 20px 18px;
}

.task {
    display: flex;

    align-items: center;

    gap: 12px;

    padding: 16px 0;

    border-bottom:
        1px solid #f0eff5;
}

.task:last-child {
    border-bottom: none;
}


/* Checkbox */

.checkbox {
    width: 20px;
    height: 20px;

    flex-shrink: 0;

    display: grid;
    place-items: center;

    border:
        2px solid #d8d5e3;

    border-radius: 6px;

    color: white;

    cursor: pointer;

    font-size: 11px;

    transition: .2s;
}

.checkbox:hover {
    border-color:
        var(--primary);
}

.checkbox.done {
    background:
        linear-gradient(
            135deg,
            var(--primary),
            var(--indigo)
        );

    border-color: transparent;
}


/* Task info */

.task-info {
    flex: 1;

    min-width: 0;
}

.task-title {
    margin-bottom: 7px;

    font-size: 13px;

    font-weight: 650;

    line-height: 1.4;
}

.task.done .task-title {
    color: #aaa7b5;

    text-decoration: line-through;
}

.task-meta {
    display: flex;

    align-items: center;

    gap: 8px;

    flex-wrap: wrap;
}


/* Tags */

.tag {
    padding: 4px 8px;

    border-radius: 20px;

    font-size: 9px;

    font-weight: 700;
}

.tag-study {
    background: #eeeaff;
    color: #5d45cc;
}

.tag-project {
    background: #e9edff;
    color: #4052c5;
}

.tag-assignment {
    background: #f0eaff;
    color: #7646c9;
}

.tag-personal {
    background: #f1f0f5;
    color: #625e70;
}


/* Priority */

.priority {
    font-size: 9px;

    font-weight: 700;
}

.high {
    color: var(--red);
}

.medium {
    color: var(--orange);
}

.low {
    color: var(--green);
}


/* Date */

.task-date {
    color: var(--muted);

    font-size: 10px;

    font-weight: 500;
}


/* ==============================
   ACTION ICONS
================================ */

.task-actions {
    display: flex;

    align-items: center;

    gap: 5px;
}

.action {
    width: 32px;
    height: 32px;

    display: grid;
    place-items: center;

    border: none;

    border-radius: 8px;

    cursor: pointer;

    transition: .2s;
}

.action svg {
    width: 15px;
    height: 15px;
}

.edit-btn {
    background: #efedff;

    color: #5b45d6;
}

.edit-btn:hover {
    background: #e1dcff;

    transform: translateY(-1px);
}

.delete-btn {
    background: #fff1f2;

    color: #c93649;
}

.delete-btn:hover {
    background: #ffe1e5;

    transform: translateY(-1px);
}


/* ==============================
   PROGRESS
================================ */

.progress-card {
    padding: 20px;
}

.progress-card h2 {
    font-size: 16px;

    margin-bottom: 5px;
}

.progress-circle {
    width: 150px;
    height: 150px;

    margin: 18px auto;

    display: grid;
    place-items: center;

    position: relative;

    border-radius: 50%;

    background:
        conic-gradient(
            var(--primary)
            var(--progress),
            #eeedf4 0
        );
}

.progress-circle::before {
    content: "";

    position: absolute;

    width: 116px;
    height: 116px;

    background: white;

    border-radius: 50%;
}

.progress-number {
    position: relative;

    font-size: 27px;

    font-weight: 800;
}

.progress-text {
    text-align: center;

    color: var(--muted);

    font-size: 11px;
}

.category-row {
    margin-top: 19px;
}

.category-label {
    display: flex;

    justify-content: space-between;

    margin-bottom: 7px;

    font-size: 11px;
}

.category-label strong {
    color: #5d45cc;
}

.bar {
    height: 6px;

    overflow: hidden;

    border-radius: 20px;

    background: #eeeef4;
}

.bar span {
    display: block;

    height: 100%;

    border-radius: inherit;

    background:
        linear-gradient(
            90deg,
            #6d4aff,
            #4338ca
        );

    transition: width .4s ease;
}


/* ==============================
   MODAL
================================ */

.modal-overlay {
    position: fixed;

    inset: 0;

    display: none;

    align-items: center;

    justify-content: center;

    padding: 20px;

    background:
        rgba(20,17,40,.55);

    backdrop-filter: blur(6px);

    z-index: 500;
}

.modal-overlay.show {
    display: flex;
}

.modal {
    width: 100%;

    max-width: 490px;

    padding: 25px;

    border-radius: 17px;

    background: white;

    box-shadow:
        0 30px 90px rgba(0,0,0,.2);

    animation:
        modalIn .2s ease;
}

@keyframes modalIn {

    from {
        opacity: 0;
        transform: translateY(10px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}

.modal-header {
    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 22px;
}

.modal-header h2 {
    font-size: 18px;
}

.close {
    width: 32px;
    height: 32px;

    border: none;

    border-radius: 8px;

    background: #f4f3f8;

    cursor: pointer;

    color: #666274;

    font-size: 20px;
}

.form-group {
    margin-bottom: 15px;
}

.form-group label {
    display: block;

    margin-bottom: 7px;

    font-size: 11px;

    font-weight: 700;
}

.form-group input,
.form-group select {
    width: 100%;

    padding: 11px;

    border:
        1px solid var(--border);

    border-radius: 9px;

    background: #fbfbfe;

    color: var(--text);

    outline: none;

    font-size: 12px;
}

.form-group input:focus,
.form-group select:focus {
    border-color:
        var(--primary);

    background: white;
}

.form-row {
    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 12px;
}

.save-btn {
    width: 100%;

    margin-top: 4px;

    padding: 12px;

    border: none;

    border-radius: 9px;

    background:
        linear-gradient(
            135deg,
            #6d4aff,
            #4338ca
        );

    color: white;

    font-size: 12px;

    font-weight: 700;

    cursor: pointer;
}


/* ==============================
   EMPTY
================================ */

.empty {
    padding: 45px 20px;

    text-align: center;

    color: var(--muted);
}

.empty-icon {
    margin-bottom: 10px;

    font-size: 34px;
}


/* ==============================
   MOBILE
================================ */

@media (max-width: 1100px) {

    .stats {
        grid-template-columns:
            repeat(2,1fr);
    }

    .content-grid {
        grid-template-columns: 1fr;
    }

}


@media (max-width: 800px) {

    .sidebar {
        transform:
            translateX(-100%);

        box-shadow:
            15px 0 40px rgba(0,0,0,.2);
    }

    .sidebar.open {
        transform:
            translateX(0);
    }

    .sidebar-close {
        display: grid;

        place-items: center;
    }

    .main {
        width: 100%;

        margin-left: 0;

        padding: 20px;
    }

    .mobile-menu {
        display: grid;

        place-items: center;
    }

    .topbar-left {
        gap: 10px;
    }

    .greeting h1 {
        font-size: 21px;
    }

}


@media (max-width: 600px) {

    .stats {
        grid-template-columns:
            1fr 1fr;

        gap: 10px;
    }

    .stat-card {
        padding: 15px;
    }

    .stat-number {
        font-size: 22px;
    }

    .stat-icon {
        width: 36px;
        height: 36px;
    }

    .filters {
        flex-wrap: wrap;
    }

    .search {
        flex-basis: 100%;
    }

    .task {
        align-items: flex-start;
    }

}


@media (max-width: 450px) {

    .main {
        padding: 14px;
    }

    .topbar {
        align-items: flex-start;
    }

    .add-btn {
        padding: 10px 12px;

        font-size: 11px;
    }

    .greeting h1 {
        font-size: 18px;
    }

    .greeting p {
        font-size: 11px;
    }

    .form-row {
        grid-template-columns: 1fr;
    }

    .task-title {
        font-size: 12px;
    }

    .action {
        width: 30px;
        height: 30px;
    }

}

</style>
</head>

<script>

/* =====================================================
   DATA
===================================================== */

let tasks =
    JSON.parse(
        localStorage.getItem(
            "taskflow_tasks"
        )
    ) || [

        {
            id: 1,

            title:
                "Complete Media Project Management notes",

            category:
                "Study",

            priority:
                "High",

            date:
                new Date()
                .toISOString()
                .split("T")[0],

            completed:
                false
        },

        {
            id: 2,

            title:
                "Research ideas for semester project",

            category:
                "Project",

            priority:
                "Medium",

            date:
                new Date()
                .toISOString()
                .split("T")[0],

            completed:
                false
        },

        {
            id: 3,

            title:
                "Submit assignment",

            category:
                "Assignment",

            priority:
                "High",

            date:
                new Date()
                .toISOString()
                .split("T")[0],

            completed:
                true
        }

    ];


let currentFilter = "all";

let currentView = "dashboard";

let editingId = null;


/* =====================================================
   SAVE
===================================================== */

function saveTasks() {

    localStorage.setItem(
        "taskflow_tasks",
        JSON.stringify(tasks)
    );

}


/* =====================================================
   SIDEBAR
===================================================== */

function openSidebar() {

    document
        .getElementById("sidebar")
        .classList.add("open");

}


function closeSidebar() {

    document
        .getElementById("sidebar")
        .classList.remove("open");

}


/* =====================================================
   NAVIGATION
===================================================== */

function changeView(
    view,
    button
) {

    currentView = view;

    currentFilter = "all";


    document
        .querySelectorAll(
            ".nav-item"
        )
        .forEach(item => {

            item.classList.remove(
                "active"
            );

        });


    button.classList.add(
        "active"
    );


    document
        .querySelectorAll(
            ".filter-btn"
        )
        .forEach(btn => {

            btn.classList.remove(
                "active"
            );

        });


    document
        .querySelector(
            ".filter-btn"
        )
        .classList.add(
            "active"
        );


    const title =
        document.getElementById(
            "taskHeading"
        );


    const pageTitle =
        document.getElementById(
            "pageTitle"
        );


    const subtitle =
        document.getElementById(
            "pageSubtitle"
        );


    if (view === "dashboard") {

        title.textContent =
            "My Tasks";

        pageTitle.textContent =
            "Good morning";

        subtitle.textContent =
            "Let's make today productive.";

    }

    else if (view === "all") {

        title.textContent =
            "All Tasks";

        pageTitle.textContent =
            "All Tasks";

        subtitle.textContent =
            "Everything you need to get done.";

    }

    else if (view === "important") {

        title.textContent =
            "Important Tasks";

        pageTitle.textContent =
            "Important";

        subtitle.textContent =
            "Your high-priority tasks.";

    }

    else {

        const names = {

            Study:
                "Study",

            Project:
                "Media Projects",

            Assignment:
                "Assignments",

            Personal:
                "Personal"

        };


        title.textContent =
            names[view] || view;

        pageTitle.textContent =
            names[view] || view;

        subtitle.textContent =
            "Tasks in this category.";

    }


    renderTasks();

    closeSidebar();

}


/* =====================================================
   SETTINGS
===================================================== */

function showSettings() {

    alert(
        "Settings panel coming soon."
    );

    closeSidebar();

}


/* =====================================================
   MODAL
===================================================== */

function openModal(
    id = null
) {

    editingId = id;


    document
        .getElementById("modal")
        .classList.add("show");


    if (id) {

        const task =
            tasks.find(
                t => t.id === id
            );


        document
            .getElementById(
                "modalTitle"
            )
            .textContent =
            "Edit Task";


        document
            .getElementById(
                "taskTitle"
            )
            .value =
            task.title;


        document
            .getElementById(
                "taskCategory"
            )
            .value =
            task.category;


        document
            .getElementById(
                "taskPriority"
            )
            .value =
            task.priority;


        document
            .getElementById(
                "taskDate"
            )
            .value =
            task.date;

    }

    else {

        document
            .getElementById(
                "modalTitle"
            )
            .textContent =
            "Add New Task";


        document
            .getElementById(
                "taskForm"
            )
            .reset();


        document
            .getElementById(
                "taskDate"
            )
            .value =
            new Date()
            .toISOString()
            .split("T")[0];

    }

}


function closeModal() {

    document
        .getElementById(
            "modal"
        )
        .classList.remove(
            "show"
        );

    editingId = null;

}


/* =====================================================
   ADD / EDIT
===================================================== */

document
    .getElementById(
        "taskForm"
    )
    .addEventListener(
        "submit",
        function(e) {

            e.preventDefault();


            const title =
                document
                    .getElementById(
                        "taskTitle"
                    )
                    .value
                    .trim();


            const category =
                document
                    .getElementById(
                        "taskCategory"
                    )
                    .value;


            const priority =
                document
                    .getElementById(
                        "taskPriority"
                    )
                    .value;


            const date =
                document
                    .getElementById(
                        "taskDate"
                    )
                    .value;


            if (editingId) {

                const task =
                    tasks.find(
                        t =>
                            t.id ===
                            editingId
                    );


                task.title =
                    title;

                task.category =
                    category;

                task.priority =
                    priority;

                task.date =
                    date;

            }

            else {

                tasks.unshift({

                    id:
                        Date.now(),

                    title,

                    category,

                    priority,

                    date,

                    completed:
                        false

                });

            }


            saveTasks();

            renderTasks();

            closeModal();

        }
    );


/* =====================================================
   COMPLETE
===================================================== */

function toggleTask(id) {

    const task =
        tasks.find(
            t => t.id === id
        );


    task.completed =
        !task.completed;


    saveTasks();

    renderTasks();

}


/* =====================================================
   DELETE
===================================================== */

function deleteTask(id) {

    if (
        !confirm(
            "Are you sure you want to delete this task?"
        )
    ) {

        return;

    }


    tasks =
        tasks.filter(
            t => t.id !== id
        );


    saveTasks();

    renderTasks();

}


/* =====================================================
   FILTER
===================================================== */

function setFilter(
    filter,
    button
) {

    currentFilter =
        filter;


    document
        .querySelectorAll(
            ".filter-btn"
        )
        .forEach(btn =>
            btn.classList.remove(
                "active"
            )
        );


    button.classList.add(
        "active"
    );


    renderTasks();

}


/* =====================================================
   RENDER
===================================================== */

function renderTasks() {

    const list =
        document.getElementById(
            "taskList"
        );


    const search =
        document
            .getElementById(
                "search"
            )
            .value
            .toLowerCase();


    let filtered =
        tasks.filter(task => {


            const matchesSearch =
                task.title
                    .toLowerCase()
                    .includes(
                        search
                    );


            const matchesFilter =
                currentFilter ===
                    "all" ||

                (
                    currentFilter ===
                    "pending" &&
                    !task.completed
                ) ||

                (
                    currentFilter ===
                    "completed" &&
                    task.completed
                );


            let matchesView =
                true;


            if (
                currentView ===
                "important"
            ) {

                matchesView =
                    task.priority ===
                    "High";

            }

            else if (
                [
                    "Study",
                    "Project",
                    "Assignment",
                    "Personal"
                ]
                .includes(
                    currentView
                )
            ) {

                matchesView =
                    task.category ===
                    currentView;

            }


            return (
                matchesSearch &&
                matchesFilter &&
                matchesView
            );

        });


    document
        .getElementById(
            "taskCount"
        )
        .textContent =
        `${filtered.length} ${
            filtered.length === 1
            ? "task"
            : "tasks"
        }`;


    if (
        filtered.length === 0
    ) {

        list.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    ◇
                </div>

                <strong>
                    No tasks found
                </strong>

                <p
                    style="
                    margin-top:6px;
                    font-size:11px;
                    "
                >
                    Add a new task to get started.
                </p>

            </div>

        `;


        updateStats();

        return;

    }


    list.innerHTML =
        filtered
        .map(task => {


            let tagClass;


            if (
                task.category ===
                "Study"
            ) {

                tagClass =
                    "tag-study";

            }

            else if (
                task.category ===
                "Project"
            ) {

                tagClass =
                    "tag-project";

            }

            else if (
                task.category ===
                "Assignment"
            ) {

                tagClass =
                    "tag-assignment";

            }

            else {

                tagClass =
                    "tag-personal";

            }


            const priorityClass =
                task.priority
                    .toLowerCase();


            return `

                <div
                    class="
                    task
                    ${
                        task.completed
                        ? "done"
                        : ""
                    }
                    "
                >


                    <div
                        class="
                        checkbox
                        ${
                            task.completed
                            ? "done"
                            : ""
                        }
                        "
                        onclick="
                            toggleTask(
                                ${task.id}
                            )
                        "
                    >

                        ${
                            task.completed
                            ? "✓"
                            : ""
                        }

                    </div>


                    <div
                        class="task-info"
                    >

                        <div
                            class="task-title"
                        >
                            ${
                                escapeHTML(
                                    task.title
                                )
                            }
                        </div>


                        <div
                            class="task-meta"
                        >

                            <span
                                class="
                                tag
                                ${tagClass}
                                "
                            >
                                ${
                                    task.category
                                }
                            </span>


                            <span
                                class="
                                priority
                                ${priorityClass}
                                "
                            >
                                ${
                                    task.priority
                                }
                            </span>


                            <span
                                class="task-date"
                            >
                                ${
                                    formatDate(
                                        task.date
                                    )
                                }
                            </span>

                        </div>

                    </div>


                    <div
                        class="task-actions"
                    >


                        <!-- EDIT -->

                        <button
                            class="
                            action
                            edit-btn
                            "
                            onclick="
                                openModal(
                                    ${task.id}
                                )
                            "
                            aria-label="Edit task"
                            title="Edit task"
                        >

                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >

                                <path
                                    d="
                                    M12 20
                                    H21
                                    "
                                />

                                <path
                                    d="
                                    M16.5 3.5
                                    A2.1 2.1 0 0 1
                                    19.5 6.5
                                    L8 18
                                    L3 19.5
                                    L4.5 14.5
                                    Z
                                    "
                                />

                            </svg>

                        </button>


                        <!-- DELETE -->

                        <button
                            class="
                            action
                            delete-btn
                            "
                            onclick="
                                deleteTask(
                                    ${task.id}
                                )
                            "
                            aria-label="Delete task"
                            title="Delete task"
                        >

                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >

                                <polyline
                                    points="
                                    3 6
                                    5 6
                                    21 6
                                    "
                                />

                                <path
                                    d="
                                    M8 6
                                    V4
                                    H16
                                    V6
                                    "
                                />

                                <path
                                    d="
                                    M19 6
                                    L18 20
                                    H6
                                    L5 6
                                    "
                                />

                                <line
                                    x1="10"
                                    y1="10"
                                    x2="10"
                                    y2="16"
                                />

                                <line
                                    x1="14"
                                    y1="10"
                                    x2="14"
                                    y2="16"
                                />

                            </svg>

                        </button>


                    </div>


                </div>

            `;

        })
        .join("");


    updateStats();

}


/* =====================================================
   STATS
===================================================== */

function updateStats() {

    const total =
        tasks.length;


    const completed =
        tasks.filter(
            t => t.completed
        ).length;


    const pending =
        total -
        completed;


    const today =
        new Date();


    today.setHours(
        0,
        0,
        0,
        0
    );


    const overdue =
        tasks.filter(task => {

            if (
                task.completed
            ) {

                return false;

            }


            const date =
                new Date(
                    task.date
                );


            date.setHours(
                0,
                0,
                0,
                0
            );


            return date < today;

        }).length;


    document
        .getElementById(
            "totalTasks"
        )
        .textContent =
        total;


    document
        .getElementById(
            "completedTasks"
        )
        .textContent =
        completed;


    document
        .getElementById(
            "pendingTasks"
        )
        .textContent =
        pending;


    document
        .getElementById(
            "overdueTasks"
        )
        .textContent =
        overdue;


    const percentage =
        total === 0
        ? 0
        : Math.round(
            completed /
            total *
            100
        );


    document
        .getElementById(
            "progressNumber"
        )
        .textContent =
        percentage + "%";


    document
        .getElementById(
            "progressCircle"
        )
        .style
        .setProperty(
            "--progress",
            percentage + "%"
        );


    updateCategory(
        "Study",
        "study"
    );


    updateCategory(
        "Project",
        "project"
    );


    updateCategory(
        "Assignment",
        "assignment"
    );

}


/* =====================================================
   CATEGORY PROGRESS
===================================================== */

function updateCategory(
    category,
    id
) {

    const categoryTasks =
        tasks.filter(
            t =>
                t.category ===
                category
        );


    const completed =
        categoryTasks.filter(
            t => t.completed
        ).length;


    const percentage =
        categoryTasks.length === 0
        ? 0
        : Math.round(
            completed /
            categoryTasks.length *
            100
        );


    document
        .getElementById(
            id + "Percent"
        )
        .textContent =
        percentage + "%";


    document
        .getElementById(
            id + "Bar"
        )
        .style.width =
        percentage + "%";

}


/* =====================================================
   DATE
===================================================== */

function formatDate(
    date
) {

    const d =
        new Date(
            date + "T00:00:00"
        );


    return d.toLocaleDateString(
        "en-IN",
        {
            day: "numeric",
            month: "short",
            year: "numeric"
        }
    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
    text
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text;


    return div.innerHTML;

}


/* =====================================================
   MODAL OUTSIDE CLICK
===================================================== */

document
    .getElementById(
        "modal"
    )
    .addEventListener(
        "click",
        function(e) {

            if (
                e.target ===
                this
            ) {

                closeModal();

            }

        }
    );


/* =====================================================
   ESCAPE KEY
===================================================== */

document.addEventListener(
    "keydown",
    function(e) {

        if (
            e.key ===
            "Escape"
        ) {

            closeModal();

            closeSidebar();

        }

    }
);


/* =====================================================
   INITIALIZE
===================================================== */

renderTasks();

</script>

</body>
</html>
